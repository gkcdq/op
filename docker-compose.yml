services:
  backend:
    build: ./backend
    container_name: finadory-backend

    ports:
      - "3001:3000" 
    environment:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finadory-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_URL}
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: finadory-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN} 
    depends_on:
      - frontend
      - backend