services:
  backend:
    build: ./backend
    container_name: finadory-backend
    ports:
      - "3002:3001" 
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finadory-frontend
    ports:
      - "5175:5175"
    environment:
      - VITE_API_URL=${VITE_URL} 
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: finadory-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN} 
    depends_on:
      - frontend
      - backend